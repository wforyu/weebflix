<!DOCTYPE html>
<html lang="en"><head><title></title><script>
function loadBotGuard(challengeData) {
  this.vm = this[challengeData.globalName];
  this.program = challengeData.program;
  this.vmFunctions = {};
  this.syncSnapshotFunction = null;
  if (!this.vm) throw new Error('[BotGuardClient]: VM not found in the global object');
  if (!this.vm.a) throw new Error('[BotGuardClient]: Could not load program');
  var vmFunctionsCallback = function (asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction) {
    this.vmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };
  this.syncSnapshotFunction = this.vm.a(this.program, vmFunctionsCallback, true, this.userInteractionElement, function () {}, [ [], [] ])[0];
  return new Promise(function (resolve, reject) {
    var i = 0;
    var refreshIntervalId = setInterval(function () {
      if (!!this.vmFunctions.asyncSnapshotFunction) {
        resolve(this);
        clearInterval(refreshIntervalId);
      }
      if (i >= 10000) {
        reject('asyncSnapshotFunction is null even after 10 seconds');
        clearInterval(refreshIntervalId);
      }
      i += 1;
    }.bind(this), 1);
  });
}

function snapshot(args) {
  return new Promise(function (resolve, reject) {
    if (!this.vmFunctions.asyncSnapshotFunction)
      return reject(new Error('[BotGuardClient]: Async snapshot function not found'));
    this.vmFunctions.asyncSnapshotFunction(function (response) { resolve(response); }, [
      args.contentBinding,
      args.signedTimestamp,
      args.webPoSignalOutput,
      args.skipPrivacyBuffer
    ]);
  }.bind(this));
}

function runBotGuard(challengeData) {
  var interpreterJavascript = challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
  if (interpreterJavascript) {
    new Function(interpreterJavascript)();
  } else throw new Error('Could not load VM');
  var webPoSignalOutput = [];
  return loadBotGuard.call(this, {
    globalName: challengeData.globalName,
    globalObj: this,
    program: challengeData.program
  }).then(function (botguard) {
    return botguard.snapshot({ webPoSignalOutput: webPoSignalOutput });
  }).then(function (botguardResponse) {
    // CRITICAL: store webPoSignalOutput on window._potState BEFORE returning
    // Functions cannot cross the JS<->Kotlin bridge via JSON.stringify
    window._potState = window._potState || {};
    window._potState.webPoSignalOutput = webPoSignalOutput;
    return botguardResponse;
  });
}

function obtainPoToken(webPoSignalOutput, integrityToken, identifier) {
  var getMinter = webPoSignalOutput[0];
  if (!getMinter) throw new Error('PMD:Undefined');
  var mintCallback = getMinter(integrityToken);
  if (!(mintCallback instanceof Function)) throw new Error('APF:Failed');
  var result = mintCallback(identifier);
  if (!result) throw new Error('YNJ:Undefined');
  if (!(result instanceof Uint8Array)) throw new Error('ODM:Invalid');
  return result;
}
</script></head><body></body></html>
